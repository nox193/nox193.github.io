<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <style>
        body {
            background-color: #333;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .checkout-container {
            margin: 20px;
            max-width: 900px;
            background-color: #444;
            padding: 20px;
            border-radius: 8px;
        }
        .checkout-item {
            background-color: #555;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .checkout-item p {
            margin: 5px 0;
        }
        .total-price {
            font-size: 22px;
            font-weight: bold;
            color: #4CAF50;
            text-align: center;
            margin-top: 20px;
        }
        .button-container {
            text-align: center;
            margin-top: 20px;
        }
        #paypal-button-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="checkout-container">
        <h1>Checkout</h1>
        <div class="cart" id="checkout-items"></div>
        <p class="total-price" id="total-price">Total: $0</p>
        <div id="paypal-button-container"></div>
    </div>

    <script src="https://www.paypal.com/sdk/js?client-id=BAAxMrEYe7OMYvVzCwnVqgquvV5kO1NzhC4JLcDyCEfj7-gfEg2FdBUJn7Y0Wo2ovIYXPVO_H-UYDV1dC0&components=buttons&disable-funding=venmo&currency=USD"></script>

    <script>
        // Display cart items and calculate total
        const checkoutItemsContainer = document.getElementById('checkout-items');
        const totalPriceElement = document.getElementById('total-price');
        const cart = JSON.parse(localStorage.getItem('cart')) || [];

        let totalPrice = 0;
        
        if (cart.length === 0) {
            checkoutItemsContainer.innerHTML = '<p>Your cart is empty.</p>';
            totalPriceElement.innerText = 'Total: $0';
        } else {
            cart.forEach((item) => {
                const cartItemDiv = document.createElement('div');
                cartItemDiv.classList.add('checkout-item');
                cartItemDiv.innerHTML = `
                    <div>
                        <p><strong>Product:</strong> ${item.productName}</p>
                        <p><strong>Amount:</strong> ${item.btcAmount} BTC</p>
                        <p><strong>Total Price:</strong> $${item.totalPrice}</p>
                    </div>
                `;
                checkoutItemsContainer.appendChild(cartItemDiv);
                totalPrice += parseFloat(item.totalPrice);
            });

            totalPriceElement.innerText = `Total: $${totalPrice.toFixed(2)}`;
        }

        // PayPal Buttons setup
        paypal.Buttons({
            createOrder: function(data, actions) {
                return actions.order.create({
                    purchase_units: [{
                        amount: {
                            value: totalPrice.toFixed(2) // Set the total amount dynamically
                        }
                    }]
                });
            },
            onApprove: function(data, actions) {
                return actions.order.capture().then(function(details) {
                    alert('Transaction completed by ' + details.payer.name.given_name);
                    localStorage.removeItem('cart'); // Clear cart after purchase
                    window.location.href = 'thankyou.html'; // Redirect to thank you page
                });
            }
        }).render('#paypal-button-container'); // Render PayPal button inside the container
    </script>
</body>
</html>
