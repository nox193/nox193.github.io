<body>
    <style>
        body{
            background-image: url(free-website-background-09.jpg);
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }


        @keyframes h1 {
            0% {
                transform: scale(0.5);
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
            }
        }



        h1 {
            font-size: 50px;
            text-align: center;
            animation-name: h1;
            animation-duration: 4s;
        }




    </style>

    <script>

setTimeout(function() {

}, 5000);

 </script>

        </div>
